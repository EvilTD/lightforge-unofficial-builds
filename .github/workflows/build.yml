
name: Build Lightforge Unofficial

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write

concurrency:
  group: lightforge-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LIGHTFORGE_KEYSTORE_PASSWORD: ${{ secrets.LIGHTFORGE_KEYSTORE_PASSWORD }}
      LIGHTFORGE_KEY_ALIAS: ${{ secrets.LIGHTFORGE_KEY_ALIAS }}
      LIGHTFORGE_KEY_PASSWORD: ${{ secrets.LIGHTFORGE_KEY_PASSWORD }}

    steps:
      - name: Checkout unofficial repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout original Lightforge source
        uses: actions/checkout@v4
        with:
          repository: LibreStatic/lightforge
          ref: main
          path: upstream

      - name: Check for upstream changes
        id: changes
        run: |
          CURRENT=$(git -C upstream rev-parse HEAD)
          PREVIOUS=$(cat upstream-commit.txt 2>/dev/null || echo "")
          echo "commit=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$CURRENT" > upstream-commit.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add upstream-commit.txt
            git commit -m "Update upstream Lightforge commit"
            git push
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=$([ "$CURRENT" != "$PREVIOUS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Set up Android SDK
        if: steps.changes.outputs.build == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        if: steps.changes.outputs.build == 'true'
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Prepare signing key
        if: steps.changes.outputs.build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing signing key"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lightforge.jks"
          echo "LIGHTFORGE_KEYSTORE_PATH=$RUNNER_TEMP/lightforge.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        if: steps.changes.outputs.build == 'true'
        working-directory: upstream
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          ./gradlew test lint \
            -Plightforge.versionCode="$VERSION_CODE" \
            :app:assembleOfflineRelease

      - name: Verify offline build
        if: steps.changes.outputs.build == 'true'
        working-directory: upstream
        run: python tools/verify_offline_release.py --expect-all-files

      - name: Prepare release
        if: steps.changes.outputs.build == 'true'
        id: release
        working-directory: upstream
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          CODE=$((GITHUB_RUN_NUMBER + 100))
          TAG="v${VERSION}+${CODE}"
          mkdir -p dist
          cp app/build/outputs/apk/offline/release/*.apk "dist/Lightforge-${VERSION}-${CODE}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.changes.outputs.build == 'true'
        working-directory: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --title "Lightforge ${{ steps.release.outputs.version }} (${{ steps.release.outputs.code }})" \
            --notes "Unofficial build of Lightforge by FacuM.

          Original project: https://github.com/LibreStatic/lightforge

          Upstream source commit: ${{ steps.changes.outputs.commit }}

          Independently compiled and signed. Not affiliated with or endorsed by the original developer." \
            --prerelease
